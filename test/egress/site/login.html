<meta charset="utf-8">
<title>Sign in</title>
<h1>Sign in</h1>
<form method="post" action="/signed-in">
  <p><label>Username <input id="username" name="username" autocomplete="username"></label>
  <p><label>Password <input id="password" name="password" type="password"
                            autocomplete="current-password"></label>
  <p><button>Sign in</button>
</form>
