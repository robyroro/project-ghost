# The Rust crates //ghost uses that Chromium doesn't vendor. Never built:
# tools/rust_vendor.py resolves this manifest with cargo, pins every crate
# Chromium also has to Chromium's version (`pin`), and vendors the rest
# with generated BUILD.gn files (`vendor`).
[package]
name = "ghost_rust_deps"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
# The blocking engine (docs/adr/0006-blocking-engine-adblock-rust.md). No
# public-suffix crates (Chromium resolves registrable domains). CSS validation
# (Phase 4B) parses procedural rules into operators and refuses invalid
# selectors and :style() values.
adblock = { version = "=0.13.3", default-features = false, features = ["full-regex-handling", "css-validation"] }
